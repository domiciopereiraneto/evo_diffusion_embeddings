# best_all.jpg is the project convention for the best image in a prompt run.
# If it is missing, fallback_to_latest uses the latest best_N.jpg or it_N.jpg.
best_image_name: best_all
fallback_to_latest: true

# Optional metric captions drawn below each image. Use [] to disable. For each
# prompt, the highest value for each displayed metric is drawn in bold.
# Supported aliases include objective, aesthetic, clip, image_reward, hpsv2,
# pickscore, or full CSV column names such as max_image_reward_score.
image_metrics:
  - image_reward
  #- clip
  #- hpsv2

# Metrics are read from score_results.csv or fitness_results.csv. For optimized
# images, last usually matches the final/best_all summary row; best selects the
# best combined_score/max_fitness row; first is useful for baseline it_0.
metric_row_selector: last
baseline_metric_row_selector: first
metric_font_size: 12
metric_precision: 3
metric_gap: 4

# Baseline is read from it_0.jpg in the first configured algorithm folder.
include_baseline: true
baseline_label: Initial Generation

output: results_image_grids/prompt_x_algorithm_best_sdxlturbo_imagereward_all.jpg

tile_size: 160x160
algorithm_label_width: 90
prompt_header_height: 86
prompt_label_width: 180
algorithm_header_height: 70
column_gap: 10
row_gap: 3
margin: 12
prompt_font_size: 14
algorithm_font_size: 16
rotate_algorithm_labels: true
