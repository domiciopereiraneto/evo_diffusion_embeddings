# Prompt x algorithm best-image grid config for algorithms/create_prompt_algorithm_grid.py.
#
# Run:
#   python algorithms/create_prompt_algorithm_grid.py --config algorithms/config/config_prompt_algorithm_grid.yaml
#
# The script compares selected prompts across algorithm folders using each
# prompt's best/final image and optional metric captions.

# Layout options:
#   prompt_x_algorithm: prompts are columns, algorithms are rows.
#   algorithm_x_prompt: algorithms are columns, prompts are rows.
layout: algorithm_x_prompt

# Each algorithm folder must resolve to exactly one run directory containing
# results_* prompt folders. Labels become row headers in prompt_x_algorithm and
# column headers in algorithm_x_prompt.
algorithms:
  - label: AdamW
    #folder: results_sdxlturbo/results_adam_sdxlturbo_clip
    #folder: results_sdxlturbo/results_adam_sdxlturbo_hpsv2
    folder: results_sdxlturbo/results_adam_sdxlturbo_imagereward
  - label: Zero-Order
    folder: results_sdxlturbo/results_zeroorder_sdxlturbo_image_reward
    #folder: results_sdxlturbo/results_zeroorder_sdxlturbo_hpsv2
    #folder: results_sdxlturbo/results_zeroorder_sdxlturbo_clip
  - label: CoSyNE
    #folder: results_sdxlturbo/results_cosyne_sdxlturbo_clip
    #folder: results_sdxlturbo/results_cosyne_sdxlturbo_hpsv2
    folder: results_sdxlturbo/results_cosyne_sdxlturbo_imagereward
  - label: GA
    #folder: results_sdxlturbo/results_ga_sdxlturbo_clip
    #folder: results_sdxlturbo/results_ga_sdxlturbo_hpsv2
    folder: results_sdxlturbo/results_ga_sdxlturbo_image_reward
  - label: sep-CMA-ES
    #folder: results_sdxlturbo/results_sepcmaes_sdxlturbo_clip
    #folder: results_sdxlturbo/results_sepcmaes_sdxlturbo_hpsv2
    folder: results_sdxlturbo/results_sepcmaes_sdxlturbo_imagereward
  - label: SNES
    #folder: results_sdxlturbo/results_snes_sdxlturbo_clip
    #folder: results_sdxlturbo/results_snes_sdxlturbo_hpsv2
    folder: results_sdxlturbo/results_snes_sdxlturbo_imagereward
  - label: SNES (extended)
    #folder: results_sdxlturbo/results_snes_sdxlturbo_clip_extended
    #folder: results_sdxlturbo/results_snes_sdxlturbo_hpsv2_extended
    folder: results_sdxlturbo/results_snes_sdxlturbo_imagereward_extended

